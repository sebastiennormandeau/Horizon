<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Horizon — le budget à base zéro, simplifié pour les foyers du Québec. Zero-based budgeting made simple for households.">

  <!-- Couleur de la barre du navigateur, accordée au thème actif de l'app. -->
  <meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">

  <!-- iOS : l'app s'ajoute à l'écran d'accueil et s'ouvre en plein écran.
       C'est le seul mode d'installation disponible sur iPhone sans compte
       Apple Developer. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Horizon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Plaid Link Support -->
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>

  <title>Horizon</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Désinstalle UNIQUEMENT le service worker de cache de Flutter, hérité
    // des versions précédentes : il servait un bundle périmé après un
    // déploiement (d'où --pwa-strategy=none aujourd'hui). Surtout ne pas
    // toucher au service worker de messagerie (firebase-messaging-sw.js),
    // que le plugin FCM enregistre pour les notifications en arrière-plan.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) {
          var sw = regs[i].active || regs[i].installing || regs[i].waiting;
          if (sw && sw.scriptURL && sw.scriptURL.indexOf('flutter_service_worker') !== -1) {
            regs[i].unregister();
          }
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
